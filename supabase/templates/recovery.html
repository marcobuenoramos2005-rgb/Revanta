<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#17201d">
  <p style="font-size:20px;font-weight:600;margin:0 0 24px">Revanta</p>
  <h1 style="font-size:22px;margin:0 0 12px">Restablece tu contraseña</h1>
  <p style="font-size:16px;line-height:1.5;margin:0 0 24px">Hemos recibido una solicitud para cambiar tu contraseña. Pulsa el botón para elegir una nueva. El enlace caduca en 1 hora.</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer" style="display:inline-block;background:#11866a;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Elegir nueva contraseña</a>

</div>
